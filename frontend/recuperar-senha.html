
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha | Meu Financeiro</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <main class="auth-container">

        <div class="auth-logo">
            <div class="logo-icon">M</div>
            <div>
                <h2>Meu Financeiro</h2>
                <span>Controle pessoal</span>
            </div>
        </div>

        <section class="auth-card">

            <!-- ETAPA 1 -->
            <div id="etapaEmail">

                <div class="auth-heading">
                    <h1>Recuperar senha</h1>
                    <p>Informe seu email para receber um código de recuperação.</p>
                </div>

                <form id="formRecuperar">

                    <div class="form-group">
                        <label for="emailRecuperacao">E-mail</label>
                        <input
                            type="email"
                            id="emailRecuperacao"
                            placeholder="seu@email.com"
                            maxlength="200"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <button type="submit" id="btnEnviarCodigo"
                        class="btn-primary auth-button">
                        Enviar código
                    </button>

                    <p id="mensagemRecuperacao" class="form-message"></p>

                </form>
            </div>

            <!-- ETAPA 2 -->
            <div id="etapaCodigo" hidden>

                <div class="auth-heading">
                    <h1>Verificar código</h1>
                    <p>Digite o código de seis dígitos enviado para seu email.</p>
                </div>

                <form id="formCodigo">

                    <div class="form-group">
                        <label for="codigoRecuperacao">Código</label>
                        <input
                            type="text"
                            id="codigoRecuperacao"
                            placeholder="000000"
                            inputmode="numeric"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            autocomplete="one-time-code"
                            required
                        >
                    </div>

                    <button type="submit" id="btnVerificarCodigo"
                        class="btn-primary auth-button">
                        Verificar código
                    </button>

                    <p id="mensagemCodigo" class="form-message"></p>

                </form>
            </div>

            <!-- ETAPA 3 -->
            <div id="etapaNovaSenha" hidden>

                <div class="auth-heading">
                    <h1>Nova senha</h1>
                    <p>Crie uma nova senha para sua conta.</p>
                </div>

                <form id="formNovaSenha">

                    <div class="form-group">
                        <label for="novaSenha">Nova senha</label>
                        <input
                            type="password"
                            id="novaSenha"
                            placeholder="Mínimo de 8 caracteres"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite novamente sua senha"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" id="btnRedefinirSenha"
                        class="btn-primary auth-button">
                        Redefinir senha
                    </button>

                    <p id="mensagemNovaSenha" class="form-message"></p>

                </form>
            </div>

            <div class="auth-footer">
                <a href="/login">Voltar para o login</a>
            </div>

        </section>

        <footer class="auth-copy">
            Meu Financeiro © 2026
        </footer>

    </main>

    <script src="/js/auth.js"></script>

</body>
</html>
